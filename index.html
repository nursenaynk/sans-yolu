<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Şans Yolu 🎲</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff4dc;color:#392b4c;text-align:center}header{background:#7653b5;color:white;padding:22px 12px}h1{margin:0 0 8px}main{max-width:760px;margin:auto;padding:18px}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:22px 0}.cell{min-height:70px;aspect-ratio:1;border:3px solid #392b4c;border-radius:13px;background:#ffce63;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.cell:nth-child(4n+2){background:#ff9eae}.cell:nth-child(4n+3){background:#9ee4d0}.cell:nth-child(4n+4){background:#c8b5fa}.number{font-size:12px;font-weight:bold}.symbol{font-size:26px}.pawns{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;font-size:22px}.panel{background:white;padding:20px;border-radius:20px;box-shadow:0 5px 15px #392b4c22;margin:14px 0}button{background:#7653b5;color:white;border:0;border-radius:14px;padding:12px 19px;font-size:16px;font-weight:bold;cursor:pointer;margin:5px}button:disabled{opacity:.45;cursor:not-allowed}input,select{font:inherit;padding:12px;border:2px solid #c8b5fa;border-radius:12px;max-width:100%;margin:5px}.dice{font-size:58px;margin:10px}.muted{color:#756b85}.hide{display:none!important}#message{min-height:35px;font-weight:bold}#players{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.player{padding:10px 12px;background:#fff0f6;border-radius:12px;border:2px solid #f9a8d4}.player.turn{border-color:#7653b5;background:#eee5ff}.row{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px}#notice{color:#b32650;min-height:22px}.code{font-size:25px;font-weight:bold;color:#c02575;letter-spacing:2px}
</style></head><body><header><h1>🎲 ŞANS YOLU 🎲</h1><div>At zarını, dene şansını! • 2–6 oyuncu</div></header><main>
<section class="panel" id="lobby"><h2>🎀 Oyun Odası</h2><div class="row"><input id="name" maxlength="20" placeholder="Oyuncu adın" aria-label="Oyuncu adın"><select id="color" aria-label="Piyon rengi"><option value="pink">🩷 Pembe</option><option value="blue">💙 Mavi</option><option value="green">💚 Yeşil</option><option value="yellow">💛 Sarı</option><option value="purple">💜 Mor</option><option value="red">❤️ Kırmızı</option></select></div><div class="row"><button id="create">🎲 Yeni Oda Oluştur</button></div><div class="row"><input id="joinCode" inputmode="numeric" maxlength="6" placeholder="6 haneli oda kodu" aria-label="Oda kodu"><button id="join">🎟️ Odaya Katıl</button></div><p class="muted">Arkadaşlarınla oda kodunu paylaş ve birlikte oyna!</p></section>
<section class="panel hide" id="room"><h2>🎟️ Oda Kodu</h2><div class="code" id="roomCode"></div><div class="row"><button id="copy">📋 Kodu Kopyala</button><button id="leave">🚪 Odadan Çık</button></div><h3>🎀 Odadaki Oyuncular</h3><div id="players"></div><p id="status"></p><div class="row"><button id="start" class="hide">▶️ Oyunu Başlat</button><button id="reset" class="hide">🔄 Yeni Tur</button></div></section>
<section class="panel hide" id="game"><h2>🏆 Bitişe ilk ulaşan kazanır!</h2><div class="board" id="board"></div><div class="dice" id="dice">⚀</div><button id="roll" disabled>🎲 Zar At!</button><p id="message">Oyuncular bekleniyor...</p></section><p id="notice" role="status"></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const db=window.supabase.createClient("https://grejyxtuuhqtdxneqrch.supabase.co","sb_publishable_hhAy9_4qvjSSrPeipvOk_w__SCnt8Iw");
const icons=["🏁","⭐","🎁","🍀","⚡","💎","❓","🌈","🎲","🎁","🌸","⭐","⚡","🍀","💎","🎁","🌈","❓","⭐","🏆"];
const emoji={pink:"🩷",blue:"💙",green:"💚",yellow:"💛",purple:"💜",red:"❤️"};const labels={pink:"Pembe",blue:"Mavi",green:"Yeşil",yellow:"Sarı",purple:"Mor",red:"Kırmızı"};const el=id=>document.getElementById(id);
let code=localStorage.getItem("sansYoluRoom")||"",state=null,loading=false,lastMessage="";
const notice=t=>el("notice").textContent=t||"";
async function auth(){const {data}=await db.auth.getSession();if(data.session)return;const {error}=await db.auth.signInAnonymously();if(error)throw Error("Oyuncu girişi yapılamadı: "+error.message)}
async function call(fn,args){const {data,error}=await db.rpc(fn,args);if(error)throw Error(error.message);return data}
function showRoom(c){code=String(c);localStorage.setItem("sansYoluRoom",code);el("lobby").classList.add("hide");el("room").classList.remove("hide");el("roomCode").textContent=code;el("game").classList.remove("hide");notice("")}
function back(){code="";state=null;localStorage.removeItem("sansYoluRoom");el("lobby").classList.remove("hide");el("room").classList.add("hide");el("game").classList.add("hide")}
function render(s){state=s;el("roomCode").textContent=s.code;const players=el("players");players.replaceChildren();s.players.forEach(p=>{const item=document.createElement("div");item.className="player"+(s.status==="playing"&&p.turn===s.turn?" turn":"");item.textContent=(emoji[p.color]||"🎲")+" "+p.name+(p.mine?" (Sen)":"")+" · "+(p.position+1)+". kutu";players.appendChild(item)});const current=s.players.find(p=>p.turn===s.turn);const winner=s.players.find(p=>p.position===19);el("status").textContent=s.status==="waiting"?"⏳ Oyuncular bekleniyor ("+s.players.length+"/6)":s.status==="finished"?"🏆 Kazanan: "+(winner?.name||"Bilinmiyor"):"🎯 Sıra: "+(current?.name||"");el("start").classList.toggle("hide",!s.host||s.status!=="waiting");el("start").disabled=s.players.length<2;el("reset").classList.toggle("hide",!s.host||s.status==="waiting");const me=s.players.find(p=>p.mine);el("roll").disabled=s.status!=="playing"||!me||me.turn!==s.turn||loading;el("message").textContent=lastMessage||(s.status==="waiting"?"Oda sahibi oyunu başlatınca başlayacağız.":s.status==="finished"?"🏆 Oyun tamamlandı!":me?.turn===s.turn?"🎲 Sıra sende!":"⏳ Sıranı bekle...");const board=el("board");board.replaceChildren();icons.forEach((ic,i)=>{const cell=document.createElement("div");cell.className="cell";const number=document.createElement("span");number.className="number";number.textContent=i+1;const symbol=document.createElement("span");symbol.className="symbol";symbol.textContent=ic;const pawns=document.createElement("div");pawns.className="pawns";s.players.filter(p=>p.position===i).forEach(p=>{const pawn=document.createElement("span");pawn.textContent=emoji[p.color]||"🎲";pawn.title=p.name;pawns.appendChild(pawn)});cell.append(number,symbol,pawns);board.appendChild(cell)})}
async function refresh(){if(!code||loading)return;try{const s=await call("game_state",{p_code:code});if(code===s.code)render(s)}catch(e){notice("Oda yüklenemedi: "+e.message)}}
async function busy(action){if(loading)return;loading=true;notice("");try{await auth();await action()}catch(e){notice(e.message);alert(e.message)}finally{loading=false;if(code)await refresh()}}
el("create").onclick=()=>busy(async()=>{const name=el("name").value.trim();if(!name||name.length>20)throw Error("1–20 karakterlik oyuncu adı yaz.");const c=await call("create_game_room",{p_player_name:name,p_pawn_color:el("color").value});lastMessage="";showRoom(c)});
el("join").onclick=()=>busy(async()=>{const c=el("joinCode").value.trim(),name=el("name").value.trim();if(!/^\d{6}$/.test(c))throw Error("6 haneli oda kodunu gir.");if(!name||name.length>20)throw Error("1–20 karakterlik oyuncu adı yaz.");const available=await call("available_colors",{p_code:c});if(!available.includes(el("color").value))throw Error(available.length?"Bu renk dolu. Boş renkler: "+available.map(x=>labels[x]).join(", "):"Oda dolu.");await call("join_game_room",{p_room_code:c,p_player_name:name,p_pawn_color:el("color").value});lastMessage="";showRoom(c)});
el("start").onclick=()=>busy(async()=>{await call("start_game",{p_code:code});lastMessage="🎲 Oyun başladı!"});
el("roll").onclick=()=>busy(async()=>{const r=await call("roll_turn",{p_code:code});lastMessage=r.message;el("dice").textContent=["⚀","⚁","⚂","⚃","⚄","⚅"][r.dice-1]});
el("reset").onclick=()=>busy(async()=>{await call("restart_game",{p_code:code});lastMessage="🔄 Yeni tur için oyuncular bekleniyor."});
el("copy").onclick=async()=>{try{await navigator.clipboard.writeText(code);notice("📋 Oda kodu kopyalandı!")}catch{notice("Oda kodunu seçip kopyalayabilirsin: "+code)}};
el("leave").onclick=()=>{back();notice("Odadan ayrıldın. (Oyuncu kaydın odada kalır.)")};
(async()=>{try{await auth();if(code){showRoom(code);await refresh()}}catch(e){notice(e.message)}})();setInterval(refresh,2500);
</script></body></html>
